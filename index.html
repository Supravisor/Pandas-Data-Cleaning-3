
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pandas Data Cleaning 3</title>
  <link href="./styles.css" rel="stylesheet" />
</head>

<body>

  <h1>Pandas - Data Cleaning 3</h1>

  <form name="editor">
    <table>
      <tbody>
        <tr>
          <td id="buttons">
            <div>

<h2>Import modules</h2>

<p>
  <input type="button" class="btn btn-module" value="csv" onclick="document.editor.textbox.value+='\nimport csv as csv'" />
  <input type="button" class="btn btn-module" value="numpy" onclick="document.editor.textbox.value+='\nimport numpy as np'" />
  <input type="button" class="btn btn-module" value="pandas" onclick="document.editor.textbox.value+='\nimport pandas as pd'" />
  <input type="button" class="btn btn-module" value="version" onclick="document.editor.textbox.value+='\nprint(np.__version__)'" />
</p>

<hr />
<h2>Reading data with Python</h2>

<p>
  <input class="btn" name="filePath" id="filePath" placeholder="file path" type="textfield" />
  <input class="btn" name="fileObject" id="fileObject" placeholder="file object" type="textfield" />
</p>

<p>
  <input type="button" class="btn btn-success" value="read contents" onclick="readContents();" />
  <input type="button" class="btn btn-success" value="format contents" onclick="formatContents();" />
  <input type="button" class="btn btn-success" value="use csv module" onclick="useModule();" />
</p>

<label>
delimiter
  <select name="delimiter">
    <option value=""></option>
    <option value=">">greater than sign</option>
    <option value=",">comma</option>
    <option value=";">semi-colon</option>
    <option value="\t">tab</option>
  </select>
</label>

<hr />
<h2>Reading data with Pandas</h2>

<p>
  <input type="button" class="btn btn-success" value="read_csv()" onclick="readCsv();" />
</p>

<p>
  <label>
header
  </label>
</p>
            </div>            
          </td>
          <td id="textbox">
            <textarea id="preview" name="textbox"></textarea>            
          </td>
          <td id="empty"></td>
        </tr>
      </tbody>
    </table>    
  </form>

  <script src="./script.js"></script>

</body>
</html>
